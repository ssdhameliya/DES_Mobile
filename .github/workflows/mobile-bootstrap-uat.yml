name: Mobile UAT Server Bootstrap
run-name: Mobile UAT server bootstrap

on:
  workflow_dispatch:
    inputs:
      confirm_uat_server_change:
        description: 'I confirm this is the UAT server only and approve the one-time Nginx mobile download route setup'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mobile-uat-server-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Configure UAT mobile download route
    runs-on: ubuntu-latest
    environment: uat
    timeout-minutes: 15
    env:
      SSH_HOST: ${{ secrets.DSE_SSH_HOST }}
      SSH_USER: ${{ secrets.DSE_SSH_USER }}
      SSH_KEY: ${{ secrets.DSE_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DSE_SSH_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.DSE_SSH_PORT }}
      PUBLIC_BASE_URL: https://api-uat.jasviindustries.in/mobile/android/uat
    steps:
      - name: Require explicit UAT bootstrap approval
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.confirm_uat_server_change }}' == 'true' ]] || {
            echo 'UAT server bootstrap confirmation was not approved.' >&2
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate SSH configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "Missing GitHub uat environment SSH secret: $name" >&2; exit 1; }
          done
          echo "SSH_PORT=${SSH_PORT:-22}" >> "$GITHUB_ENV"

      - name: Configure strict SSH host verification
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/dse_mobile_deploy_key
          chmod 600 ~/.ssh/dse_mobile_deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload one-time bootstrap script
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dse_mobile_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'mkdir -p /tmp/dse-mobile-ci-bootstrap'
          scp -i ~/.ssh/dse_mobile_deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=yes \
            scripts/mobile/bootstrap-nginx-uat.sh \
            "$SSH_USER@$SSH_HOST:/tmp/dse-mobile-ci-bootstrap/"

      - name: Bootstrap UAT static mobile route
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dse_mobile_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "bash /tmp/dse-mobile-ci-bootstrap/bootstrap-nginx-uat.sh api-uat.jasviindustries.in"

      - name: Verify public route end-to-end
        shell: bash
        run: |
          set -euo pipefail
          printf 'DSE_MOBILE_UAT_ROUTE_OK\n' > mobile-route-probe.txt
          scp -i ~/.ssh/dse_mobile_deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=yes \
            mobile-route-probe.txt \
            "$SSH_USER@$SSH_HOST:/tmp/dse-mobile-ci-bootstrap/mobile-route-probe.txt"
          ssh -i ~/.ssh/dse_mobile_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "sudo -n install -o dseerp -g dseerp -m 0644 /tmp/dse-mobile-ci-bootstrap/mobile-route-probe.txt /srv/dse-erp/uat/mobile/android/uat/mobile-route-probe.txt"

          BODY="$(curl --fail --silent --show-error --max-time 20 "$PUBLIC_BASE_URL/mobile-route-probe.txt")"
          [[ "$BODY" == 'DSE_MOBILE_UAT_ROUTE_OK' ]] || {
            echo "Unexpected UAT mobile route response: $BODY" >&2
            exit 1
          }
          echo "MOBILE_UAT_PUBLIC_ROUTE_OK"

      - name: Clean probe and remote staging
        if: always()
        shell: bash
        run: |
          if [[ -f ~/.ssh/dse_mobile_deploy_key ]]; then
            ssh -i ~/.ssh/dse_mobile_deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" \
              'sudo -n rm -f /srv/dse-erp/uat/mobile/android/uat/mobile-route-probe.txt; rm -rf /tmp/dse-mobile-ci-bootstrap' || true
          fi

      - name: Bootstrap summary
        if: success()
        shell: bash
        run: |
          {
            echo '### UAT mobile server bootstrap complete'
            echo '- UAT Nginx static route is active.'
            echo '- Public route probe passed.'
            echo '- No DSE ERP database or server service was changed.'
            echo '- PROD was not touched.'
          } >> "$GITHUB_STEP_SUMMARY"
