name: Apply Mobile 1.2.8 source patch

on:
  push:
    branches: [mobile-1.2.8-fixes]
    paths:
      - '.github/workflows/apply-mobile-1.2.8.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v6
        with:
          ref: mobile-1.2.8-fixes
          fetch-depth: 0

      - name: Reassemble and apply exact 1.2.8 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tmp/mobile128.part-* > /tmp/mobile128.patch
          git apply --check /tmp/mobile128.patch
          git apply /tmp/mobile128.patch

      - name: Verify Android source contract
        working-directory: mobile-source/DSE-ERP-Mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-android-source.py

      - name: Commit clean 1.2.8 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/tmp
          rm -f .github/workflows/apply-mobile-1.2.8.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Mobile 1.2.8 login actions and bank statement fixes'
          git push origin HEAD:mobile-1.2.8-fixes
