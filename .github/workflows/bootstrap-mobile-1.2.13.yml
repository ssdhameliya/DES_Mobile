name: Bootstrap Mobile 1.2.13 Source

on:
  push:
    branches: [release/mobile-1.2.13]
    paths:
      - '.payload-temp/**'
      - 'release-bootstrap/**'
      - '.github/workflows/bootstrap-mobile-1.2.13.yml'

permissions:
  contents: write

concurrency:
  group: mobile-1213-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source payload
        shell: bash
        run: |
          set -euo pipefail

          # part-00 was the only corrupted transfer. Rebuild it from the exact
          # locally generated base64 chunks and prove its Git blob identity.
          cat .payload-temp/part00.b64-* | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/source1213.part-00"
          [[ "$(wc -c < "$RUNNER_TEMP/source1213.part-00")" -eq 16000 ]] || {
            echo "part-00 size mismatch" >&2
            exit 1
          }
          [[ "$(git hash-object "$RUNNER_TEMP/source1213.part-00")" == "3c91ca96f9285f76f8d74360aaab2bf0fec4bf41" ]] || {
            echo "part-00 Git blob mismatch" >&2
            exit 1
          }

          {
            cat "$RUNNER_TEMP/source1213.part-00"
            for n in 01 02 03 04 05 06 07 08 09 10 11 12; do
              cat "release-bootstrap/source1213.tar.xz.part-$n"
            done
          } > "$RUNNER_TEMP/source1213.tar.xz"

          echo "0bc5abcf27e2b0ed77b7dff2673214f7653dcd48890c0a89ffd42179f020216c  $RUNNER_TEMP/source1213.tar.xz" | sha256sum -c -

          rm -rf mobile-source/DSE-ERP-Mobile
          mkdir -p mobile-source
          tar -xJf "$RUNNER_TEMP/source1213.tar.xz" -C mobile-source

          test -f mobile-source/DSE-ERP-Mobile/androidApp/build.gradle.kts
          python3 mobile-source/DSE-ERP-Mobile/scripts/verify-android-source.py
          grep -F 'versionName = "1.2.13"' mobile-source/DSE-ERP-Mobile/androidApp/build.gradle.kts
          grep -F 'versionCode = 133' mobile-source/DSE-ERP-Mobile/androidApp/build.gradle.kts
          grep -F 'const val SERVER_BASELINE = "10.0.16"' mobile-source/DSE-ERP-Mobile/shared/src/commonMain/kotlin/org/dse/mobile/core/config/MobileBuildInfo.kt

      - name: Commit exact 1.2.13 source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .payload-temp release-bootstrap
          rm -f .github/workflows/bootstrap-mobile-1.2.13.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No source changes found.' >&2; exit 1; }
          git commit -m "Prepare Mobile 1.2.13 Android source"
          git push origin HEAD:release/mobile-1.2.13
