name: Mobile 1.2.7 Final RC

on:
  push:
    branches:
      - fix/mobile-1.2.7-final-rc
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-1.2.7-final-rc
  cancel-in-progress: false

jobs:
  build-final-rc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment: uat
    timeout-minutes: 35

    steps:
      - name: Checkout RC branch
        uses: actions/checkout@v6
        with:
          ref: fix/mobile-1.2.7-final-rc
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Prepare safe RC patch and regression expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          patch = Path('scripts/apply-mobile-1.2.7-fixes.py')
          text = patch.read_text(encoding='utf-8')
          start_marker = 'app_dir = MOBILE / "composeApp" / "src" / "commonMain" / "kotlin" / "org" / "dse" / "mobile" / "app"'
          end_marker = '# -----------------------------------------------------------------------------\n# Bank reconciliation:'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          safe_block = r'''app_dir = MOBILE / "composeApp" / "src" / "commonMain" / "kotlin" / "org" / "dse" / "mobile" / "app"
          for path in app_dir.glob("*.kt"):
              text = path.read_text(encoding="utf-8")
              text = text.replace('"PDF / Print"', '"Share PDF"').replace('"Print PDF"', '"Share PDF"')
              if path.name == "DocumentScreens.kt":
                  text = re.sub(
                      r'(?m)^\s*OutlinedButton\(onClick=\{saveViewPrompt=true\}\)\{[^\n]*Text\("Save View"\)\}\s*$',
                      '',
                      text,
                  )
                  text = re.sub(
                      r'(?m)^\s*if\(savedViews\.isNotEmpty\(\)\)DseSelect\("Saved View"[^\n]*$',
                      '',
                      text,
                  )
              elif path.name == "QuotationScreens.kt":
                  text = re.sub(
                      r';if\(savedViews\.isNotEmpty\(\)\)DseSelect\("Saved View"[^\n]*?;PremiumSecondaryButton\("Save View",\{saveViewPrompt=true\},icon=Icons\.Rounded\.BookmarkAdd\)',
                      '',
                      text,
                  )
              relpath = str(path.relative_to(ROOT)).replace("\\", "/")
              save(relpath, text)

          '''
          patch.write_text(text[:start] + safe_block + text[end:], encoding='utf-8', newline='\n')

          compat = Path('mobile-source/DSE-ERP-Mobile/shared/src/commonTest/kotlin/org/dse/mobile/core/MobileCompatibilityTest.kt')
          value = compat.read_text(encoding='utf-8')
          value = value.replace(
              'policy(iosMin = "1.2.0", iosLatest = "1.2.5"), "iOS", "1.2.5")',
              'policy(iosMin = "1.2.0", iosLatest = "1.2.6"), "iOS", "1.2.5")',
          )
          value = value.replace('assertEquals("1.2.5", result.latestVersion)', 'assertEquals("1.2.6", result.latestVersion)')
          compat.write_text(value, encoding='utf-8', newline='\n')

          phase = Path('mobile-source/DSE-ERP-Mobile/shared/src/commonTest/kotlin/org/dse/mobile/core/MobilePhaseContractTest.kt')
          value = phase.read_text(encoding='utf-8')
          value = value.replace(
              'assertEquals("1.2.5",MobileBuildInfo.MOBILE_VERSION_NAME);assertEquals("1.2.5-V10.0.7-DISTRIBUTION",MobileBuildInfo.MOBILE_VERSION)',
              'assertEquals("1.2.7",MobileBuildInfo.MOBILE_VERSION_NAME);assertEquals("1.2.7-V10.0.7-DISTRIBUTION",MobileBuildInfo.MOBILE_VERSION)',
          )
          phase.write_text(value, encoding='utf-8', newline='\n')
          PY

      - name: Apply Mobile 1.2.7 corrective patch
        shell: bash
        run: python3 scripts/apply-mobile-1.2.7-fixes.py

      - name: Configure permanent UAT signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.JASVI_UAT_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.JASVI_UAT_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JASVI_UAT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JASVI_UAT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "Missing UAT signing secret: $name" >&2; exit 1; }
          done
          KEYSTORE="$RUNNER_TEMP/jasvi-uat-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<EOF
          jasviUatStoreFile=$KEYSTORE
          jasviUatStorePassword=$STORE_PASSWORD
          jasviUatKeyAlias=$KEY_ALIAS
          jasviUatKeyPassword=$KEY_PASSWORD
          EOF
          chmod 600 "$KEYSTORE" "$HOME/.gradle/gradle.properties"

      - name: Run JVM regression tests and build signed UAT APK
        working-directory: mobile-source/DSE-ERP-Mobile
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :shared:jvmTest :androidApp:assembleUatRelease --console=plain

      - name: Verify package, version and permanent signing
        working-directory: mobile-source/DSE-ERP-Mobile
        shell: bash
        run: |
          set -euo pipefail
          APK='androidApp/build/outputs/apk/uat/release/androidApp-uat-release.apk'
          [[ -f "$APK" ]] || { echo "UAT APK missing: $APK" >&2; exit 1; }

          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" | head -1)"
          echo "$BADGING"
          grep -q "name='org.dse.erp.mobile.uat'" <<<"$BADGING"
          grep -q "versionCode='127'" <<<"$BADGING"
          grep -q "versionName='1.2.7'" <<<"$BADGING"

          CERT="$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')"
          echo "Signer SHA-256: $CERT"
          [[ "$CERT" == '080909884b59b256b2d90d423813fb236d377135604860cdc738d7a48eb54ec9' ]] || {
            echo 'Unexpected UAT signing certificate.' >&2
            exit 1
          }

      - name: Prepare IntelliJ source copy and build artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/mobile-1.2.7-artifacts"
          SRC="$RUNNER_TEMP/Jasvi-Mobile-1.2.7-IntelliJ"
          mkdir -p "$OUT" "$SRC"

          rsync -a mobile-source/DSE-ERP-Mobile/ "$SRC/" \
            --exclude '.gradle/' \
            --exclude '.idea/' \
            --exclude '**/build/' \
            --exclude 'local.properties' \
            --exclude '*.jks' \
            --exclude '*.keystore'

          (cd "$RUNNER_TEMP" && zip -qr "$OUT/Jasvi-Mobile-1.2.7-IntelliJ.zip" 'Jasvi-Mobile-1.2.7-IntelliJ')

          cp mobile-source/DSE-ERP-Mobile/androidApp/build/outputs/apk/uat/release/androidApp-uat-release.apk \
            "$OUT/Jasvi-Mobile-1.2.7-UAT.apk"
          sha256sum "$OUT/Jasvi-Mobile-1.2.7-UAT.apk" > "$OUT/Jasvi-Mobile-1.2.7-UAT.apk.sha256"

      - name: Upload verified RC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Jasvi-Mobile-1.2.7-Final-RC
          path: ${{ runner.temp }}/mobile-1.2.7-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified source fixes to RC branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile-source/DSE-ERP-Mobile
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Mobile 1.2.7 final RC fixes [skip ci]'
          git push origin HEAD:fix/mobile-1.2.7-final-rc

      - name: RC summary
        shell: bash
        run: |
          {
            echo '### Jasvi Mobile 1.2.7 Final RC'
            echo '- Mobile-side corrective batch applied.'
            echo '- Android UAT package verified as org.dse.erp.mobile.uat / 127 / 1.2.7.'
            echo '- Permanent UAT signing certificate verified.'
            echo '- JVM regression tests passed.'
            echo '- No server/API/config changes were made.'
            echo '- Source changes were committed only to fix/mobile-1.2.7-final-rc.'
          } >> "$GITHUB_STEP_SUMMARY"
