name: Mobile PR Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile-source/DSE-ERP-Mobile/**'
      - '.github/workflows/mobile-*.yml'

permissions:
  contents: read

concurrency:
  group: mobile-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Install Android SDK command-line tools and packages
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager is not installed on this runner; refusing to bypass SDK validation."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify Android/mobile source contracts
        working-directory: mobile-source/DSE-ERP-Mobile
        run: python3 scripts/verify-android-source.py
      - name: Run shared contracts and Compose JVM compile
        working-directory: mobile-source/DSE-ERP-Mobile
        run: |
          chmod +x gradlew
          ./gradlew :shared:jvmTest :composeApp:compileKotlinJvm --console=plain
