name: Mobile 1.2.11 Stage

on:
  push:
    branches: [stage/mobile-1.2.11]

permissions:
  contents: write

concurrency:
  group: mobile-1211-stage
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply exact 1.2.11 source transforms
        run: |
          python3 scripts/mobile1211_apply.py
          python3 scripts/mobile1211_fix_shared_gradle.py
          python3 scripts/mobile1211_final_fixes.py
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify source contracts
        working-directory: mobile-source/DSE-ERP-Mobile
        run: python3 scripts/verify-android-source.py
      - name: Run shared tests and Compose JVM compile
        working-directory: mobile-source/DSE-ERP-Mobile
        run: |
          chmod +x gradlew
          ./gradlew :shared:jvmTest :composeApp:compileKotlinJvm --console=plain
      - name: Commit validated application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A mobile-source/DSE-ERP-Mobile
          git diff --cached --check
          git commit -m 'Mobile 1.2.11: complete UAT fix set' || true
          git push origin HEAD:stage/mobile-1.2.11
