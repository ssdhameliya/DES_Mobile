name: Mobile PROD Server Bootstrap
run-name: Mobile PROD server bootstrap

on:
  workflow_dispatch:
    inputs:
      confirm_prod_server_change:
        description: 'I confirm this is the PROD server and approve the one-time Caddy mobile download route setup'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mobile-prod-server-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Configure PROD mobile download route
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SSH_HOST: ${{ secrets.DSE_SSH_HOST }}
      SSH_USER: ${{ secrets.DSE_SSH_USER }}
      SSH_KEY: ${{ secrets.DSE_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DSE_SSH_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.DSE_SSH_PORT }}
      PUBLIC_BASE_URL: https://api.jasviindustries.in/mobile/android/prod
      PUBLIC_HEALTH_URL: https://api.jasviindustries.in/api/runtime/health
    steps:
      - name: Require explicit PROD bootstrap approval
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.confirm_prod_server_change }}' == 'true' ]] || {
            echo 'PROD server bootstrap confirmation was not approved.' >&2
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate SSH configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "Missing GitHub production environment SSH secret: $name" >&2; exit 1; }
          done
          echo "SSH_PORT=${SSH_PORT:-22}" >> "$GITHUB_ENV"

      - name: Verify existing public PROD API health
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --max-time 20 "$PUBLIC_HEALTH_URL")"
          python3 - "$BODY" <<'PY'
          import json,sys
          r=json.loads(sys.argv[1])
          env=str(r.get('environment','')).upper()
          if r.get('ready') is not True or env not in {'PROD','PRODUCTION'}:
              raise SystemExit(f'Unexpected PROD health before bootstrap: {r}')
          print('PRE_BOOTSTRAP_PROD_HEALTH_OK')
          PY

      - name: Configure strict SSH host verification
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/dse_mobile_deploy_key
          chmod 600 ~/.ssh/dse_mobile_deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload one-time Caddy bootstrap script
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dse_mobile_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'mkdir -p /tmp/dse-mobile-ci-bootstrap-prod'
          scp -i ~/.ssh/dse_mobile_deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=yes \
            scripts/mobile/bootstrap-caddy-prod.sh \
            "$SSH_USER@$SSH_HOST:/tmp/dse-mobile-ci-bootstrap-prod/"

      - name: Bootstrap PROD static mobile route
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dse_mobile_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "bash /tmp/dse-mobile-ci-bootstrap-prod/bootstrap-caddy-prod.sh api.jasviindustries.in"

      - name: Verify public mobile route end-to-end
        shell: bash
        run: |
          set -euo pipefail
          printf 'DSE_MOBILE_PROD_ROUTE_OK\n' > mobile-route-probe.txt
          scp -i ~/.ssh/dse_mobile_deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=yes \
            mobile-route-probe.txt \
            "$SSH_USER@$SSH_HOST:/tmp/dse-mobile-ci-bootstrap-prod/mobile-route-probe.txt"
          ssh -i ~/.ssh/dse_mobile_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "sudo -n install -o dseerp -g dseerp -m 0644 /tmp/dse-mobile-ci-bootstrap-prod/mobile-route-probe.txt /srv/dse-erp/prod/mobile/android/prod/mobile-route-probe.txt; sudo -n restorecon -F /srv/dse-erp/prod/mobile/android/prod/mobile-route-probe.txt 2>/dev/null || true"

          BODY="$(curl --fail --silent --show-error --max-time 20 "$PUBLIC_BASE_URL/mobile-route-probe.txt")"
          [[ "$BODY" == 'DSE_MOBILE_PROD_ROUTE_OK' ]] || {
            echo "Unexpected PROD mobile route response: $BODY" >&2
            exit 1
          }
          echo "MOBILE_PROD_PUBLIC_ROUTE_OK"

      - name: Verify PROD API remained healthy
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --max-time 20 "$PUBLIC_HEALTH_URL")"
          python3 - "$BODY" <<'PY'
          import json,sys
          r=json.loads(sys.argv[1])
          env=str(r.get('environment','')).upper()
          if r.get('ready') is not True or env not in {'PROD','PRODUCTION'}:
              raise SystemExit(f'Unexpected PROD health after bootstrap: {r}')
          print('POST_BOOTSTRAP_PROD_HEALTH_OK')
          PY

      - name: Clean probe and remote staging
        if: always()
        shell: bash
        run: |
          if [[ -f ~/.ssh/dse_mobile_deploy_key ]]; then
            ssh -i ~/.ssh/dse_mobile_deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" \
              'sudo -n rm -f /srv/dse-erp/prod/mobile/android/prod/mobile-route-probe.txt; rm -rf /tmp/dse-mobile-ci-bootstrap-prod' || true
          fi

      - name: Bootstrap summary
        if: success()
        shell: bash
        run: |
          {
            echo '### PROD mobile server bootstrap complete'
            echo '- PROD Caddy static route is active.'
            echo '- Public route probe passed.'
            echo '- Existing PROD API health passed before and after the Caddy reload.'
            echo '- No DSE ERP database or server service was changed.'
            echo '- UAT was not touched.'
            echo '- Set production environment variable DSE_MOBILE_PROD_DEPLOY_ENABLED=true before the first APK publication.'
          } >> "$GITHUB_STEP_SUMMARY"
