name: Apply Mobile 1.2.10 integration

on:
  push:
    branches:
      - release/mobile-1.2.10-desktop-10.0.9
    paths:
      - .github/workflows/apply-mobile-1.2.10-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/mobile-1.2.10-desktop-10.0.9
          fetch-depth: 0

      - name: Apply verified integration patches
        shell: bash
        run: |
          set -euo pipefail
          cp .github/release-1.2.10/bank-01.patch /tmp/bank-all.patch
          for part in 02 03 04 05 06 07 08; do
            part_file=".github/release-1.2.10/bank-${part}.patch"
            tail -n +3 "$part_file" >> /tmp/bank-all.patch
            if [ -n "$(tail -c 1 "$part_file")" ]; then printf '\n' >> /tmp/bank-all.patch; fi
          done
          echo "Bank source blob: $(git hash-object mobile-source/DSE-ERP-Mobile/composeApp/src/commonMain/kotlin/org/dse/mobile/app/BankFinanceScreens.kt)"
          echo "Combined patch bytes: $(wc -c < /tmp/bank-all.patch)"
          echo "Combined patch SHA256: $(sha256sum /tmp/bank-all.patch | awk '{print $1}')"
          test "$(git hash-object mobile-source/DSE-ERP-Mobile/composeApp/src/commonMain/kotlin/org/dse/mobile/app/BankFinanceScreens.kt)" = "ca5a23461a5e7a1e8414090ad766915ec28e9c26"
          test "$(sha256sum /tmp/bank-all.patch | awk '{print $1}')" = "d290aaed931525dde677ea1f8d3fa82686446617fd76ed54b4092d8031680caa"
          git apply --check .github/release-1.2.10/App.kt.patch
          git apply .github/release-1.2.10/App.kt.patch
          git apply --check /tmp/bank-all.patch
          git apply /tmp/bank-all.patch
          git apply --check .github/release-1.2.10/DocumentScreens.kt.patch
          git apply .github/release-1.2.10/DocumentScreens.kt.patch
          git apply --check .github/release-1.2.10/ReturnScreens.kt.patch
          git apply .github/release-1.2.10/ReturnScreens.kt.patch

      - name: Verify Mobile source contract
        shell: bash
        working-directory: mobile-source/DSE-ERP-Mobile
        run: |
          set -euo pipefail
          python scripts/verify-android-source.py

      - name: Commit integrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            mobile-source/DSE-ERP-Mobile/composeApp/src/commonMain/kotlin/org/dse/mobile/app/App.kt \
            mobile-source/DSE-ERP-Mobile/composeApp/src/commonMain/kotlin/org/dse/mobile/app/BankFinanceScreens.kt \
            mobile-source/DSE-ERP-Mobile/composeApp/src/commonMain/kotlin/org/dse/mobile/app/DocumentScreens.kt \
            mobile-source/DSE-ERP-Mobile/composeApp/src/commonMain/kotlin/org/dse/mobile/app/ReturnScreens.kt
          git diff --cached --check
          git commit -m "Integrate Desktop 10.0.9 linkage for Mobile 1.2.10"
          git push origin HEAD:release/mobile-1.2.10-desktop-10.0.9
