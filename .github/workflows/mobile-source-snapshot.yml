name: Mobile Source Snapshot

on:
  push:
    branches: [main]
    paths:
      - 'mobile-source/DSE-ERP-Mobile/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
      - name: Upload clean IntelliJ source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: Jasvi-Mobile-IntelliJ-${{ github.sha }}
          path: mobile-source/DSE-ERP-Mobile
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
