name: Mobile UAT
run-name: Mobile UAT @ ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - 'mobile-source/DSE-ERP-Mobile/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-uat
  cancel-in-progress: false

jobs:
  uat:
    name: Build, publish and deploy UAT
    runs-on: ubuntu-latest
    environment: uat
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SSH_HOST: ${{ secrets.DSE_SSH_HOST }}
      SSH_USER: ${{ secrets.DSE_SSH_USER }}
      SSH_KEY: ${{ secrets.DSE_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DSE_SSH_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.DSE_SSH_PORT }}
      SSH_DEPLOY_ENABLED: ${{ vars.DSE_MOBILE_UAT_DEPLOY_ENABLED }}
      PUBLIC_BASE_URL: https://api-uat.jasviindustries.in/mobile/android/uat
      PUBLIC_HEALTH_URL: https://api-uat.jasviindustries.in/api/runtime/health

    steps:
      - name: Validate UAT configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || {
            echo "Mobile UAT must run from main; got ${GITHUB_REF}" >&2
            exit 1
          }
          [[ "${SSH_DEPLOY_ENABLED:-}" == 'true' ]] || {
            echo 'DSE_MOBILE_UAT_DEPLOY_ENABLED must be true in the uat environment.' >&2
            exit 1
          }
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "Missing GitHub uat environment SSH secret: $name" >&2; exit 1; }
          done
          echo "SSH_PORT=${SSH_PORT:-22}" >> "$GITHUB_ENV"

      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version and release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          HEAD_COMMIT="$(git rev-parse HEAD)"
          MAIN_COMMIT="$(git rev-parse origin/main)"
          [[ "$HEAD_COMMIT" == "$MAIN_COMMIT" ]] || {
            echo "Workflow source is not current origin/main: head=$HEAD_COMMIT main=$MAIN_COMMIT" >&2
            exit 1
          }

          SOURCE_VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' mobile-source/DSE-ERP-Mobile/androidApp/build.gradle.kts | head -1)"
          SOURCE_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' mobile-source/DSE-ERP-Mobile/androidApp/build.gradle.kts | head -1)"
          [[ "$SOURCE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid Android versionName: $SOURCE_VERSION" >&2; exit 1; }
          [[ "$SOURCE_CODE" =~ ^[0-9]+$ ]] || { echo "Unable to resolve Android versionCode: $SOURCE_CODE" >&2; exit 1; }

          VERSION="$SOURCE_VERSION"
          VERSION_CODE="$SOURCE_CODE"
          TAG="v${VERSION}"
          TAG_STATE="create"
          OLD_TAG_COMMIT=""

          REMOTE_TAG="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          if [[ -n "$REMOTE_TAG" ]]; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
            if [[ "$TAG_COMMIT" == "$HEAD_COMMIT" ]]; then
              TAG_STATE="reuse"
              if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                IS_PRERELEASE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')"
                [[ "$IS_PRERELEASE" == 'true' ]] || {
                  echo "Release $TAG is already stable/PROD. Bump versionName/versionCode before another UAT release." >&2
                  exit 1
                }
              fi
            else
              git merge-base --is-ancestor "$TAG_COMMIT" "$HEAD_COMMIT" || {
                echo "Existing tag $TAG is not an ancestor of current main; refusing to move it." >&2
                exit 1
              }
              OLD_TAG_COMMIT="$TAG_COMMIT"
              if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                IS_PRERELEASE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')"
                [[ "$IS_PRERELEASE" == 'true' ]] || {
                  echo "Release $TAG is already stable/PROD. Bump versionName/versionCode before another UAT release." >&2
                  exit 1
                }
                TAG_STATE="replace-uat"
              else
                TAG_STATE="replace-stale"
              fi
            fi
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "MAIN_COMMIT=$HEAD_COMMIT" >> "$GITHUB_ENV"
          echo "TAG_STATE=$TAG_STATE" >> "$GITHUB_ENV"
          echo "OLD_TAG_COMMIT=$OLD_TAG_COMMIT" >> "$GITHUB_ENV"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/$(ls -1 "$ANDROID_HOME/cmdline-tools" 2>/dev/null | sort -Vr | head -1)/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [[ -x "$candidate" ]]; then SDKMANAGER="$candidate"; break; fi
          done
          [[ -n "$SDKMANAGER" ]] || { echo "sdkmanager not found under ANDROID_HOME=$ANDROID_HOME" >&2; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Configure UAT signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.JASVI_UAT_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.JASVI_UAT_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JASVI_UAT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JASVI_UAT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "Missing GitHub UAT signing secret: $name" >&2; exit 1; }
          done
          KEYSTORE="$RUNNER_TEMP/jasvi-uat-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<EOF
          jasviUatStoreFile=$KEYSTORE
          jasviUatStorePassword=$STORE_PASSWORD
          jasviUatKeyAlias=$KEY_ALIAS
          jasviUatKeyPassword=$KEY_PASSWORD
          EOF
          chmod 600 "$KEYSTORE" "$HOME/.gradle/gradle.properties"

      - name: Run shared contract tests
        working-directory: mobile-source/DSE-ERP-Mobile
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :shared:jvmTest --console=plain

      - name: Build signed UAT APK
        working-directory: mobile-source/DSE-ERP-Mobile
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :androidApp:assembleUatRelease --console=plain

      - name: Prepare and verify UAT artifacts
        working-directory: mobile-source/DSE-ERP-Mobile
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='androidApp/build/outputs/apk/uat/release/androidApp-uat-release.apk'
          [[ -f "$SOURCE" ]] || { echo "UAT release APK not found: $SOURCE" >&2; exit 1; }
          mkdir -p release-artifacts
          APK="release-artifacts/Jasvi-Mobile-${VERSION}-UAT.apk"
          cp "$SOURCE" "$APK"
          sha256sum "$APK" > "$APK.sha256"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Create or recover UAT tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          case "$TAG_STATE" in
            reuse)
              [[ "$(git rev-list -n 1 "$TAG")" == "$MAIN_COMMIT" ]] || { echo 'Existing tag moved unexpectedly.' >&2; exit 1; }
              ;;
            create)
              git tag -a "$TAG" "$MAIN_COMMIT" -m "Mobile UAT $VERSION"
              git push origin "$TAG"
              ;;
            replace-stale)
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && { echo "A release appeared for $TAG; refusing to replace tag." >&2; exit 1; }
              git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force
              [[ "$(git rev-list -n 1 "$TAG")" == "$OLD_TAG_COMMIT" ]] || { echo 'Stale tag changed during build.' >&2; exit 1; }
              git tag -d "$TAG"
              git tag -a "$TAG" "$MAIN_COMMIT" -m "Mobile UAT $VERSION"
              git push --force origin "refs/tags/$TAG"
              ;;
            replace-uat)
              IS_PRERELEASE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')"
              [[ "$IS_PRERELEASE" == 'true' ]] || { echo "Release $TAG became stable during the build; refusing to move its tag." >&2; exit 1; }
              git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force
              [[ "$(git rev-list -n 1 "$TAG")" == "$OLD_TAG_COMMIT" ]] || { echo 'UAT tag changed during build.' >&2; exit 1; }
              git tag -d "$TAG"
              git tag -a "$TAG" "$MAIN_COMMIT" -m "Mobile UAT $VERSION"
              git push --force origin "refs/tags/$TAG"
              ;;
            *)
              echo "Unknown TAG_STATE=$TAG_STATE" >&2
              exit 1
              ;;
          esac

      - name: Publish UAT GitHub prerelease
        working-directory: mobile-source/DSE-ERP-Mobile
        shell: bash
        run: |
          set -euo pipefail
          APK="release-artifacts/Jasvi-Mobile-${VERSION}-UAT.apk"
          SHA="$APK.sha256"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_PRERELEASE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')"
            [[ "$IS_PRERELEASE" == 'true' ]] || { echo "Release $TAG is already stable; refusing to demote it." >&2; exit 1; }
            gh release upload "$TAG" "$APK" "$SHA" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Jasvi Mobile ${VERSION} - UAT" --prerelease=true
          else
            gh release create "$TAG" "$APK" "$SHA" --repo "$GITHUB_REPOSITORY" --title "Jasvi Mobile ${VERSION} - UAT" --generate-notes --prerelease --verify-tag
          fi

      - name: Download and verify exact UAT release assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy-artifacts
          mkdir -p deploy-artifacts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir deploy-artifacts \
            --pattern "Jasvi-Mobile-${VERSION}-UAT.apk" \
            --pattern "Jasvi-Mobile-${VERSION}-UAT.apk.sha256"
          APK="deploy-artifacts/Jasvi-Mobile-${VERSION}-UAT.apk"
          SHA_FILE="$APK.sha256"
          EXPECTED_SHA="$(awk 'NR==1 {print tolower($1)}' "$SHA_FILE")"
          ACTUAL_SHA="$(sha256sum "$APK" | awk '{print tolower($1)}')"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo 'Invalid UAT checksum file.' >&2; exit 1; }
          [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]] || { echo "UAT checksum mismatch: expected=$EXPECTED_SHA actual=$ACTUAL_SHA" >&2; exit 1; }
          echo "EXPECTED_SHA=$EXPECTED_SHA" >> "$GITHUB_ENV"

      - name: Verify UAT API health before deploy
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --max-time 20 "$PUBLIC_HEALTH_URL")"
          python3 - "$BODY" <<'PY'
          import json,sys
          r=json.loads(sys.argv[1])
          if r.get('ready') is not True or r.get('environment') != 'UAT':
              raise SystemExit(f'Unexpected UAT health before deployment: {r}')
          print('PRE_DEPLOY_UAT_HEALTH_OK')
          PY

      - name: Configure strict SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/dse_mobile_deploy_key
          chmod 600 ~/.ssh/dse_mobile_deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Publish UAT APK to server
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dse_mobile_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'mkdir -p /tmp/dse-mobile-ci-deploy'
          scp -i ~/.ssh/dse_mobile_deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "deploy-artifacts/Jasvi-Mobile-${VERSION}-UAT.apk" \
            "deploy-artifacts/Jasvi-Mobile-${VERSION}-UAT.apk.sha256" \
            scripts/mobile/deploy-mobile-apk.sh \
            "$SSH_USER@$SSH_HOST:/tmp/dse-mobile-ci-deploy/"
          ssh -i ~/.ssh/dse_mobile_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "bash /tmp/dse-mobile-ci-deploy/deploy-mobile-apk.sh uat /tmp/dse-mobile-ci-deploy/Jasvi-Mobile-${VERSION}-UAT.apk /tmp/dse-mobile-ci-deploy/Jasvi-Mobile-${VERSION}-UAT.apk.sha256 '${VERSION}'"

      - name: Verify public UAT APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_APK="$PUBLIC_BASE_URL/Jasvi-Mobile-${VERSION}-UAT.apk"
          curl --fail --location --silent --show-error --max-time 120 "$PUBLIC_APK" -o published-uat.apk
          ACTUAL_SHA="$(sha256sum published-uat.apk | awk '{print tolower($1)}')"
          [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]] || { echo "Public UAT APK checksum mismatch: expected=$EXPECTED_SHA actual=$ACTUAL_SHA" >&2; exit 1; }
          SHA_BODY="$(curl --fail --silent --show-error --max-time 20 "$PUBLIC_APK.sha256")"
          PUBLISHED_SHA="$(printf '%s\n' "$SHA_BODY" | awk 'NR==1 {print tolower($1)}')"
          [[ "$PUBLISHED_SHA" == "$EXPECTED_SHA" ]] || { echo "Public UAT checksum mismatch: expected=$EXPECTED_SHA published=$PUBLISHED_SHA" >&2; exit 1; }

      - name: Verify UAT API health after deploy
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --max-time 20 "$PUBLIC_HEALTH_URL")"
          python3 - "$BODY" <<'PY'
          import json,sys
          r=json.loads(sys.argv[1])
          if r.get('ready') is not True or r.get('environment') != 'UAT':
              raise SystemExit(f'Unexpected UAT health after deployment: {r}')
          print('POST_DEPLOY_UAT_HEALTH_OK')
          PY

      - name: Clean remote UAT staging
        if: always()
        shell: bash
        run: |
          if [[ -f ~/.ssh/dse_mobile_deploy_key ]]; then
            ssh -i ~/.ssh/dse_mobile_deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" 'rm -rf /tmp/dse-mobile-ci-deploy' || true
          fi

      - name: UAT summary
        if: success()
        shell: bash
        run: |
          {
            echo '### Mobile UAT complete'
            echo "- Tag: $TAG"
            echo "- Version: $VERSION"
            echo "- Version code: $VERSION_CODE"
            echo "- SHA-256: $EXPECTED_SHA"
            echo '- Signed UAT APK is published on GitHub and the UAT server.'
            echo '- Public UAT APK/checksum and API health were verified.'
            echo '- After physical UAT approval, run **Mobile PROD** with this same tag.'
          } >> "$GITHUB_STEP_SUMMARY"