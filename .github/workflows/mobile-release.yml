name: Mobile UAT Release
run-name: Mobile UAT ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: mobile-uat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-uat:
    name: Build signed UAT release
    runs-on: ubuntu-latest
    environment: uat
    timeout-minutes: 30

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate tag and require current main
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must look like vX.Y.Z: $TAG" >&2; exit 1; }
          VERSION="${TAG#v}"

          git fetch origin main --depth=1
          TAG_COMMIT="$(git rev-parse HEAD)"
          MAIN_COMMIT="$(git rev-parse origin/main)"
          [[ "$TAG_COMMIT" == "$MAIN_COMMIT" ]] || {
            echo "Mobile release tag must point at current origin/main: tag=$TAG_COMMIT main=$MAIN_COMMIT" >&2
            exit 1
          }

          cd mobile-source/DSE-ERP-Mobile
          SOURCE_VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' androidApp/build.gradle.kts | head -1)"
          SOURCE_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' androidApp/build.gradle.kts | head -1)"
          [[ "$SOURCE_VERSION" == "$VERSION" ]] || {
            echo "Tag/source version mismatch: tag=$VERSION source=$SOURCE_VERSION" >&2
            exit 1
          }
          [[ -n "$SOURCE_CODE" ]] || { echo "Unable to resolve Android versionCode" >&2; exit 1; }

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$SOURCE_CODE" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Configure UAT signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.JASVI_UAT_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.JASVI_UAT_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JASVI_UAT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JASVI_UAT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "Missing GitHub UAT environment signing secret: $name" >&2; exit 1; }
          done

          KEYSTORE="$RUNNER_TEMP/jasvi-uat-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<EOF
          jasviUatStoreFile=$KEYSTORE
          jasviUatStorePassword=$STORE_PASSWORD
          jasviUatKeyAlias=$KEY_ALIAS
          jasviUatKeyPassword=$KEY_PASSWORD
          EOF
          chmod 600 "$KEYSTORE" "$HOME/.gradle/gradle.properties"

      - name: Build signed UAT APK
        working-directory: mobile-source/DSE-ERP-Mobile
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :androidApp:assembleUatRelease --console=plain

      - name: Prepare and verify UAT artifacts
        working-directory: mobile-source/DSE-ERP-Mobile
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='androidApp/build/outputs/apk/uat/release/androidApp-uat-release.apk'
          [[ -f "$SOURCE" ]] || { echo "UAT release APK not found: $SOURCE" >&2; exit 1; }

          mkdir -p release-artifacts
          APK="release-artifacts/Jasvi-Mobile-${VERSION}-UAT.apk"
          cp "$SOURCE" "$APK"
          sha256sum "$APK" > "$APK.sha256"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          echo "UAT APK ready: $APK"
          cat "$APK.sha256"

      - name: Publish UAT GitHub prerelease
        working-directory: mobile-source/DSE-ERP-Mobile
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "release-artifacts/Jasvi-Mobile-${VERSION}-UAT.apk" \
            "release-artifacts/Jasvi-Mobile-${VERSION}-UAT.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Jasvi Mobile ${VERSION} - UAT" \
            --generate-notes \
            --prerelease \
            --verify-tag

      - name: UAT release summary
        shell: bash
        run: |
          {
            echo '### Mobile UAT release created'
            echo "- Tag: $TAG"
            echo "- Version: $VERSION"
            echo "- Version code: $VERSION_CODE"
            echo '- Production is NOT automatic.'
            echo '- After UAT validation, run the separate **Mobile PROD Release** workflow manually.'
          } >> "$GITHUB_STEP_SUMMARY"
