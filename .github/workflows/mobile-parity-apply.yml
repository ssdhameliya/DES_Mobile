name: Apply Mobile Parity Source

on:
  push:
    branches:
      - work/mobile-parity-current
    paths:
      - 'mobile-source/DSE-ERP-Mobile/.mobile-parity.patch.gz.b64'
      - '.github/workflows/mobile-parity-apply.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Apply exact reviewed parity patch
        run: |
          set -euo pipefail
          base64 -d mobile-source/DSE-ERP-Mobile/.mobile-parity.patch.gz.b64 > /tmp/mobile-parity.patch.gz
          gzip -dc /tmp/mobile-parity.patch.gz > /tmp/mobile-parity.patch
          cd mobile-source/DSE-ERP-Mobile
          git apply --check /tmp/mobile-parity.patch
          git apply /tmp/mobile-parity.patch
          python3 scripts/verify-android-source.py
          chmod +x gradlew
          ./gradlew :shared:jvmTest :composeApp:compileKotlinJvm --console=plain

      - name: Replace bootstrap commit with validated source commit
        run: |
          set -euo pipefail
          rm -f mobile-source/DSE-ERP-Mobile/.mobile-parity.patch.gz.b64
          rm -f .github/workflows/mobile-parity-apply.yml
          git reset --mixed HEAD^
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Mobile parity: documents, audit, customer 360 and scheduled reports'
          git push --force-with-lease origin HEAD:work/mobile-parity-current
